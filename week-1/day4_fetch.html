<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Country Info</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #1F4E79; }
    #result { background: #f7f9fc; border: 1px solid #d0dff0; border-radius: 8px; padding: 20px; margin-top: 20px; }
    button { background: #2E75B6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1F4E79; }
  </style>
</head>
<body>

<h1>Country Info</h1>
<input type="text" id="countryInput" placeholder="Enter a country name" style="padding:8px; font-size:16px; width:250px;" onkeydown="if(event.key === 'Enter') loadCountry()">
<button onclick="loadCountry()">Search</button>
<div id="result">Enter a country name above and click Search.</div>

<script>
async function loadCountry() {
  const country = document.getElementById("countryInput").value.trim();

  if (!country) {
    document.getElementById("result").innerHTML = "Please enter a country name.";
    return;
  }

  document.getElementById("result").innerHTML = "Loading...";

  try {
    // Note: The legacy restcountries.com v3.1 endpoint was deprecated and removed CORS support.
    // We use the open, CORS-enabled countries.dev endpoint.
    const response = await fetch(`https://countries.dev/name/${encodeURIComponent(country)}`);

    if (!response.ok) {
      throw new Error(`Country not found (${response.status})`);
    }

    const data = await response.json();
    if (!data || data.length === 0) {
      throw new Error("Country not found");
    }

    const query = country.toLowerCase();
    const info = data.find(c => {
      const cName = ((typeof c.name === "object" ? c.name?.common : c.name) || "").toLowerCase();
      return cName === query;
    }) || (data.length > 1 ? [...data].sort((a, b) => (b.population || 0) - (a.population || 0))[0] : data[0]);

    const name = typeof info.name === "object" ? info.name.common : (info.name || "N/A");
    const capital = Array.isArray(info.capital) ? info.capital[0] : (info.capital || "N/A");
    const population = (typeof info.population === "number") ? info.population.toLocaleString() : (info.population || "N/A");
    const region = info.region || "N/A";
    const flag = info.flags?.emoji || info.flag || "";

    document.getElementById("result").innerHTML = `
      <h2>${flag} ${name}</h2>
      <p><strong>Capital:</strong> ${capital}</p>
      <p><strong>Region:</strong> ${region}</p>
      <p><strong>Population:</strong> ${population}</p>
    `;
  } catch (error) {
    document.getElementById("result").innerHTML = `Error: ${error.message}`;
  }
}
</script>

</body>
</html>
